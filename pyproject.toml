[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qc_launcher"
version = "0.3.0"
description = "YAML-driven CLI for quantum chemistry, MLIP, GSM, NEB, MD and pysisyphus workflows on ASE drivers"
authors = [
    { name = "Peichen Zhong" },
    { name = "Yicheng Chen" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ase",
    "numpy",
    "pyyaml",
    "pyscf>=2.10",
    "sella",
]

[project.scripts]
qc_launch = "qc_launcher.cli:main"

[project.optional-dependencies]
gpu4pyscf = [
    "cupy-cuda12x==13.4.1",
    "cutensor-cu12==2.2.0",
    "gpu4pyscf-cuda12x",
]
tblite = [
    "tblite",
]
gsm = [
    "pygsm @ git+https://github.com/X1X1010/pygsm.git",
]
pysisyphus = [
    "pysisyphus",
]
geometric = [
    "geometric",
]
mace = [
    "mace-torch",
]
fairchem = [
    "fairchem-core",
]
cuest-cu13 = [
    "nvidia-cuest-cu13==0.2.*",
]
cuest-cu12 = [
    "nvidia-cuest-cu12==0.2.*",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }
package-dir = { "" = "src" }

[tool.setuptools.package-data]
qc_launcher = ["utils/pcm_eps.txt"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B028", "UP031"]  # B028: no stacklevel on CLI-facing warnings; UP031: %-formatting in pyscf-derived dump code

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pyscf: needs pyscf",
    "gpu: needs cupy/gpu4pyscf and a GPU",
    "cuest: needs nvidia-cuest and a GPU",
    "byteqc: needs QC_LAUNCHER_BYTEQC_PYTHON pointing at a ByteQC environment (GPU)",
    "tblite: needs tblite",
    "mace: needs mace-torch and a MACE model file",
    "uma: needs fairchem-core and a UMA model file",
    "sella: needs sella",
    "geometric: needs geomeTRIC",
    "pygsm: needs pygsm",
    "pysisyphus: needs pysisyphus",
    "slow: takes more than ~30 s",
]
