[project]
name = "qc_launcher"
version = "0.1.0"
authors = [
    { name = "Peichen Zhong" },
    { name = "Yicheng Chen" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ase",
    "pyyaml",
    "pyscf<=2.10.0",
]
[project.optional-dependencies]
gpu4pyscf = [
    "cupy-cuda12x==13.4.1",
    "cutensor-cu12==2.2.0",
    "gpu4pyscf-cuda12x",
]
mace = [
    "mace-torch"
]
fairchem = [
    "fairchem-core"
]
[tool.setuptools]
packages = { find = { where = ["src"] } }
package-dir = { "" = "src" }
