inputfile: da.xyz

driver:
  name: tblite
  method: GFN2-xTB
  max_iter: 250
  retry_annealing: true

gsm:
  gsm_type: DE_GSM
  nnodes: 9
  coordinate_type: DLC  # DLC, TRIC, HDLC
  optimizer_method: eigenvector_follow
  linesearch: NoLineSearch
  ts_search: climb  # none, climb (climbing image), exact (climbing image + exact TS search)
  conv_gmax: 0.05
  dmax: 0.1
  max_iters: 100
  opt_steps: 3
  fixed_reactant: false
  fixed_product: false

# command:
# qc_launch gsm 1-gsm.yaml
