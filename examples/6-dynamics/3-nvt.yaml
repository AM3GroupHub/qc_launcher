inputfile: water.xyz

driver:
  name: tblite
  method: GFN2-xTB
  scf_max_iter: 250
  retry_annealing: true

md:
  ensemble: NVT  # NoseHooverChainNVT
  minimize:
    optimizer: FIRE
    fmax: 0.05
    max_steps: 100
    trajectory: water_min.traj
  timestep: 0.5  # fs
  temperature: 300.0  # K
  tdamp: 50.0  # fs
  tchain: 3
  tloop: 1
  nsteps: 1000
  loginterval: 10
  trajectory: water_nvt.traj
  logfile: water_nvt.log
  append_trajectory: false
  init_velocities: true
  seed: 42

# command:
# qc_launch md 3-nvt.yaml
