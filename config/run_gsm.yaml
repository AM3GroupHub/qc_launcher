inputfile: ???.xyz
charge: null
multiplicity: null

driver:
  # Any qc_launcher driver that can provide energies and forces can be used.
  name: pyscf
  xc: B3LYP
  basis: def2-SVP
  with_df: false
  with_gpu: false

gsm:
  # The direct pysisyphus integration currently supports DE-GSM only.
  # Provide a two-frame input file containing reactant and product.
  max_nodes: 9
  max_cycles: 64
  fmax: 0.05
  frms: 0.05
  dx: 0.05
  climb: true
  reparam_every: 3
  coordinate_system: DLC
  trajectory: ???_gsm.extxyz
  ts_output: ???_ts.xyz
